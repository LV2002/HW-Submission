<style>
:root{--bg:#fff;--ink:#1a1a1a;--muted:#666;--line:#e3e3e3;--soft:#f5f5f5;--good:#1a7f45;--bad:#c0392b;--accent:#1f4fd8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121212;--ink:#eee;--muted:#999;--line:#2c2c2c;--soft:#1c1c1c;--good:#4cc27f;--bad:#ff7a6b;--accent:#8aa4ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--ink:#eee;--muted:#999;--line:#2c2c2c;--soft:#1c1c1c;--good:#4cc27f;--bad:#ff7a6b;--accent:#8aa4ff;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:20px;margin:0}
.muted{color:var(--muted);font-size:14px}
button,input,select{font:inherit;color:inherit}
input,select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:9px 10px}
input{width:100%;margin:14px 0 8px}
.avg{background:var(--soft);border-radius:6px;padding:10px 12px;margin-top:14px;display:flex;justify-content:space-between}
.row{display:flex;gap:8px;margin-bottom:10px}
.row select{flex:1;min-width:0}
ul{list-style:none;margin:0;padding:0}
.st{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;cursor:pointer}
.st:hover{background:var(--soft)}
.st b{font-weight:600;overflow-wrap:anywhere}
.st span.p{white-space:nowrap;font-variant-numeric:tabular-nums}
.back{background:none;border:0;color:var(--accent);padding:4px 0;margin-bottom:12px;cursor:pointer}
.sum{display:flex;gap:10px;margin:14px 0}
.sum div{flex:1;background:var(--soft);border-radius:6px;padding:10px;text-align:center}
.sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{flex:1;padding:8px 4px;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer;font-size:14px}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
.hw .d{color:var(--muted);font-size:13px}
.tag{font-size:13px;font-weight:600;white-space:nowrap}
.tag.y{color:var(--good)} .tag.n{color:var(--bad)} .tag.w{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="wrap">
 <div id="home">
  <h1>DRH Homework Tracker</h1>
  <div class="muted" id="sub"></div>
  <p class="muted" id="loading">Loading…</p>
  <div class="avg"><span>Class average</span><b id="avg"></b></div>
  <input id="q" type="search" placeholder="Search your name" aria-label="Search your name" autocomplete="off">
  <div class="row">
   <select id="batch" aria-label="Batch"><option value="">All batches</option><option>DRH-1</option><option>DRH-2</option></select>
   <select id="sort" aria-label="Sort"><option value="name">Name A–Z</option><option value="high">Highest %</option><option value="low">Lowest %</option></select>
  </div>
  <ul id="list"></ul>
 </div>
 <div id="detail" hidden></div>
</div>
<script>
function fail(e){document.getElementById('loading').textContent='Could not load the data. Please refresh in a minute.';}
google.script.run.withSuccessHandler(start).withFailureHandler(fail).getData();
function start(DATA){
document.getElementById('loading').hidden=true;
const $ = id => document.getElementById(id);
const hws = DATA.hws, students = DATA.students;
const counted = hws.map((h,i)=>h.c?i:-1).filter(i=>i>=0), total = counted.length;
students.forEach((s,i)=>{s.id=i;s.done=counted.filter(k=>s.s[k]==='1').length;s.pct=Math.round(s.done/total*100)});
const avg = Math.round(students.reduce((a,s)=>a+s.done,0)/(students.length*total)*100);
const esc = t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('sub').textContent = (DATA.month?DATA.month+': ':'')+total+' homeworks, up to '+hws.find(h=>h.c).d+'.';
$('avg').textContent = avg+'%';
function renderList(){
  const q=$('q').value.trim().toLowerCase(), b=$('batch').value, so=$('sort').value;
  const r=students.filter(s=>(!b||s.b===b)&&s.n.toLowerCase().includes(q));
  r.sort((x,y)=>so==='high'?y.pct-x.pct||x.n.localeCompare(y.n):so==='low'?x.pct-y.pct||x.n.localeCompare(y.n):x.n.localeCompare(y.n));
  $('list').innerHTML=r.length?r.map(s=>`<li><button class="st" data-id="${s.id}"><b>${esc(s.n)}<br><span class="muted" style="font-weight:400">${esc(s.b)} · ${s.done} of ${total}</span></b><span class="p">${s.pct}%</span></button></li>`).join(''):'<li class="muted" style="padding:20px 0">No student found.</li>';
}
let filter='all';
function renderDetail(id){
  const s=students[id];
  const row=k=>{const h=hws[k],y=s.s[k]==='1';
    return `<li class="hw" data-s="${h.c||y?(y?'y':'n'):'w'}"><span>${esc(h.n)}${h.d?`<br><span class="d">${esc(h.d)}</span>`:""}</span>`+
      (y?'<span class="tag y">✓ Submitted</span>':h.c?'<span class="tag n">✗ Not submitted</span>':'<span class="tag w">Not counted yet</span>')+'</li>';};
  $('detail').innerHTML=`<button class="back" id="back">← All students</button><h2>${esc(s.n)}</h2><div class="muted">${esc(s.b)}</div>
   <div class="sum"><div><b>${s.pct}%</b><span class="muted">Submitted</span></div><div><b>${s.done}/${total}</b><span class="muted">Homeworks</span></div><div><b>${avg}%</b><span class="muted">Class avg</span></div></div>
   <div class="tabs"><button class="tab" data-f="all">All</button><button class="tab" data-f="y">Submitted (${s.done})</button><button class="tab" data-f="n">Not submitted (${total-s.done})</button></div>
   <ul id="hwl">${hws.map((_,k)=>row(k)).join('')}</ul>`;
  $('back').onclick=()=>{location.hash='';route()};
  const apply=()=>{document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',t.dataset.f===filter));
    document.querySelectorAll('#hwl li').forEach(li=>li.hidden=!(filter==='all'||li.dataset.s===filter))};
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{filter=t.dataset.f;apply()});
  apply();
}
function route(){
  const m=/^#student-(\d+)$/.exec(location.hash), s=m&&students[+m[1]];
  $('home').hidden=!!s;$('detail').hidden=!s;
  if(s){filter='all';renderDetail(s.id);window.scrollTo(0,0)}else renderList();
}
$('list').addEventListener('click',e=>{const b=e.target.closest('.st');if(b){location.hash='student-'+b.dataset.id;route()}});
['q','batch','sort'].forEach(i=>$(i).addEventListener('input',renderList));
window.addEventListener('hashchange',route);route();
}
</script>
